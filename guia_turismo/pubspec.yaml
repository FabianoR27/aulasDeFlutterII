name: guia_turismo
description: "Aplicativo Flutter de guia de turismo."
publish_to: 'none'

# Versao exibida pelo aplicativo e usado pelas lojas.
version: 1.0.0+1

environment:
  sdk: ^3.13.3

# Pacotes necessarios para executar o aplicativo.
dependencies:
  flutter:
    sdk: flutter

  # Chamadas HTTP para API e servicos do OpenStreetMap.
  http: ^1.6.0
  # Compartilha os controladores entre as telas.
  provider: ^6.1.5+1
  # Escolhe fotos da galeria ou da camera.
  image_picker: ^1.2.4
  # Cria o mapa e trabalha com coordenadas.
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  # Inicializa o Firebase e faz login.
  firebase_core: ^5.2.0
  firebase_auth: ^7.1.0
  google_sign_in: ^7.2.0
  # Faz a autorizacao OAuth no OpenStreetMap.
  flutter_appauth: ^13.0.0
dev_dependencies:
  flutter_test:
    sdk: flutter

  # Regras recomendadas para encontrar problemas no codigo.
  flutter_lints: ^6.0.0

flutter:
  # Inclui os icones padrao do Material.
  uses-material-design: true
